.titlebox{
  width:min(620px,92vw);background:rgba(20,14,8,.72);color:#fff;
  border:1px solid rgba(255,255,255,.3);border-radius:24px;padding:28px;text-align:center;
  backdrop-filter:blur(4px)
}
h1{font-size:clamp(42px,8vw,78px);line-height:.9;letter-spacing:.04em;margin:0;text-transform:uppercase}
.subtitle{margin:14px 0 26px;font-weight:700}
.names{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}
label{font-size:13px;font-weight:800;letter-spacing:.05em}
input{width:100%;margin-top:6px;padding:13px;border-radius:12px;border:0;font-size:18px}
.mainbtn{border:0;border-radius:14px;padding:14px 20px;font-weight:900;font-size:18px;cursor:pointer}
#continueBtn{margin-top:20px;width:100%}

#readyScreen{display:flex;align-items:center;justify-content:center;background:#151515;color:#fff;text-align:center;padding:30px}
#readyScreen h2{font-size:64px;margin:0 0 18px}
.readyname{font-size:38px;font-weight:900}
.vs{font-size:26px;font-weight:900;margin:10px}
#startBtn{margin-top:28px;background:#f0d29a}

#gameScreen{background:#f5f5f5;padding:10px;min-height:100vh}
.game{display:grid;grid-template-columns:1fr 180px 1fr;gap:10px;min-height:calc(100vh - 20px)}
.zone{border-radius:22px;padding:12px;display:flex;flex-direction:column}
.pink{background:#fdeaf1;border:3px solid #e9aac2}
.blue{background:#eaf4ff;border:3px solid #9dc6ef}
.head{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:22px;font-weight:900;margin-bottom:10px}
.score{font-size:25px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.word{position:relative;border:1px solid #bbb;border-radius:14px;background:#fff;font-weight:900;font-size:18px;min-height:72px;padding:8px;overflow:hidden}
.word:active{transform:scale(.97)}

.center{background:#fff;border-radius:20px;border:1px solid #ccc;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.prompt{font-size:13px;color:#666}

<body>

<section id="titleScreen" class="screen">
  <div class="titlebox">
    <h1>Vocabulary<br>Duel</h1>
    <div class="subtitle">Two players. One target. Be faster.</div>
    <div class="names">
      <label>PLAYER LEFT
        <input id="nameLeft" placeholder="Name" maxlength="14">
      </label>
      <label>PLAYER RIGHT
        <input id="nameRight" placeholder="Name" maxlength="14">
      </label>
    </div>
    <button id="continueBtn" class="mainbtn">READY FOR THE DUEL →</button>
  </div>
</section>

<section id="readyScreen" class="screen hidden">
  <div>
    <h2>READY?</h2>
    <div id="readyLeft" class="readyname"></div>
    <div class="vs">⚡ VS ⚡</div>
    <div id="readyRight" class="readyname"></div>
    <button id="startBtn" class="mainbtn">START DUEL</button>
  </div>
</section>

<section id="gameScreen" class="screen hidden">
  <div class="game">
    <section id="leftZone" class="zone pink">
      <div class="head"><span id="leftLabel"></span><span class="score"><span id="leftScore">0</span>/10</span></div>
      <div id="leftGrid" class="grid"></div>
    </section>

    <section class="center">
      <div class="prompt">Finde das englische Wort für:</div>
      <div id="targetWord" class="target"></div>
      <div id="feedback" class="feedback"></div>
      <div id="countdown" class="count hidden"></div>
      <div id="winnerBox" class="hidden">
        <div id="winnerText" class="winner"></div>
        <button id="revengeBtn" class="mainbtn">REVENGE 🔥</button>
      </div>
    </section>

    <section id="rightZone" class="zone blue">
      <div class="head"><span id="rightLabel"></span><span class="score"><span id="rightScore">0</span>/10</span></div>
      <div id="rightGrid" class="grid"></div>
    </section>
  </div>
</section>

<script>
const vocab = [{"de": "Mathematik", "en": "maths"}, {"de": "Geschichte", "en": "history"}, {"de": "Französisch; französisch", "en": "French"}, {"de": "Pause", "en": "break"}, {"de": "Mittagessen", "en": "lunch"}, {"de": "Schauspiel; darstellende Kunst", "en": "drama"}, {"de": "jeder Tag/jedes Zimmer/…", "en": "every day/room/…"}, {"de": "am Montag/Dienstag/…", "en": "on Monday/Tuesday/…"}, {"de": "richtig", "en": "right"}, {"de": "falsch", "en": "wrong"}, {"de": "in der Schule", "en": "at school"}, {"de": "ein Rundgang durch die Schule", "en": "a tour of the school"}, {"de": "Raum; Zimmer", "en": "room"}, {"de": "Kantine; (Schul-)Mensa", "en": "canteen"}, {"de": "Kunst", "en": "art"}, {"de": "Naturwissenschaft", "en": "science"}, {"de": "Labor", "en": "lab"}, {"de": "Sporthalle", "en": "sports hall"}, {"de": "(Schul-)Sport", "en": "PE (physical education)"}, {"de": "(Unterrichts-)Stunde", "en": "lesson"}, {"de": "nun; jetzt", "en": "now"}, {"de": "wo?; wohin?", "en": "where?"}, {"de": "hier; hierher", "en": "here"}, {"de": "Informations- und Kommunikationstechnologie", "en": "ICT (information and communication technology)"}, {"de": "Ich habe mich nicht verlaufen / verirrt.", "en": "I’m not lost."}, {"de": "Stundenplan", "en": "timetable"}, {"de": "Zeit; Uhrzeit", "en": "time"}, {"de": "Schulversammlung; Morgenappell", "en": "assembly"}, {"de": "Technik; Technologie", "en": "technology"}, {"de": "Geografie; Erdkunde", "en": "geography"}];

const $ = id => document.getElementById(id);
let names=['Player Left','Player Right'];
let scores=[0,0], current=null, lastTarget=null, gameDeck=[], deckIndex=0, locked=true, wrongLock=[false,false];
let lastCorrect=[-1,-1], timer=null;

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='en-US';
  speechSynthesis.speak(u);
}
function screen(id){
  ['titleScreen','readyScreen','gameScreen'].forEach(x=>$(x).classList.toggle('hidden',x!==id));
}
function resetDeck(){
  gameDeck=shuffle(vocab);
  deckIndex=0;
}
function chooseRound(){
  if(deckIndex>=gameDeck.length) resetDeck();
  current=gameDeck[deckIndex++];
  if(lastTarget && current.en===lastTarget && gameDeck.length>1){
    if(deckIndex>=gameDeck.length) resetDeck();
    current=gameDeck[deckIndex++];
  }
  lastTarget=current.en;
  const distractors=shuffle(vocab.filter(v=>v.en!==current.en)).slice(0,11).map(v=>v.en);
  return [current.en,...distractors];
}
function arrange(words,p){
  let a,idx,tries=0;
  do{a=shuffle(words);idx=a.indexOf(current.en);tries++;}while(idx===lastCorrect[p]&&tries<50);
  lastCorrect[p]=idx;
  return a;
}
function render(grid,p,words){
  grid.innerHTML='';
  words.forEach(w=>{
    const b=document.createElement('button');
    b.className='word'; b.textContent=w;
    b.addEventListener('click',()=>tap(p,w,b));
    grid.appendChild(b);
  });
}
function newRound(){
  if(scores[0]>=10||scores[1]>=10) return;
  locked=false; wrongLock=[false,false];
  $('feedback').textContent=''; $('countdown').classList.add('hidden');
  $('leftZone').classList.remove('dim'); $('rightZone').classList.remove('dim');
  const words=chooseRound();
  $('targetWord').textContent=current.de;
  render($('leftGrid'),0,arrange(words,0));
  render($('rightGrid'),1,arrange(words,1));
}
function countdown(){
  locked=true;
  $('targetWord').textContent='';
  $('feedback').textContent='';
  $('leftZone').classList.add('dim'); $('rightZone').classList.add('dim');
  $('countdown').classList.remove('hidden');
  let n=3; $('countdown').textContent=n; speak(n===3?'Three':n===2?'Two':'One');
  clearInterval(timer);
  timer=setInterval(()=>{
    n--;
    if(n>0){$('countdown').textContent=n;speak(n===3?'Three':n===2?'Two':'One');}
    else{clearInterval(timer);$('countdown').textContent='GO!';speak('Go!');setTimeout(newRound,350);}
  },1000);
}
function tap(p,w,btn){
  if(locked||wrongLock[p]) return;
  btn.classList.add('shot');

  if(w===current.en){
    locked=true;
    scores[p]++;
    $('leftScore').textContent=scores[0]; $('rightScore').textContent=scores[1];
    $('feedback').textContent='💥 Punkt für '+names[p]+'!';
    speak('Point for '+names[p]);

    if(scores[p]>=10){
      setTimeout(()=>{
        $('winnerText').textContent='🏆 '+names[p]+' gewinnt '+scores[0]+' : '+scores[1];
        $('winnerBox').classList.remove('hidden');
        speak(names[p]+' wins!');
      },700);
    } else {
      setTimeout(countdown,1300);
    }
  } else {
    wrongLock[p]=true;
    $('feedback').textContent='Daneben! '+names[p]+' ist kurz gesperrt.'; speak(names[p]+' missed!');
    setTimeout(()=>{
      btn.classList.remove('shot');
      wrongLock[p]=false;
      if(!locked)$('feedback').textContent='';
    },900);
  }
}

$('continueBtn').addEventListener('click',()=>{
  names=[ $('nameLeft').value.trim()||'Player Left', $('nameRight').value.trim()||'Player Right' ];
  $('readyLeft').textContent=names[0]; $('readyRight').textContent=names[1];
  screen('readyScreen');
});
$('startBtn').addEventListener('click',()=>{
  scores=[0,0]; lastCorrect=[-1,-1]; lastTarget=null; resetDeck(); lastTarget=null; resetDeck();
  $('leftScore').textContent='0'; $('rightScore').textContent='0';
  $('leftLabel').textContent=names[0]; $('rightLabel').textContent=names[1];
  $('winnerBox').classList.add('hidden');
  screen('gameScreen');
  countdown();
});
